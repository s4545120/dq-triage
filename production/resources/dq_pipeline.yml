# GENERATED by tools/build_production.py — do not edit; re-run the generator.
# Target: sdpt_data_trnf.udp_brnz, prefix dq_. Source tables in prod.

resources:
  jobs:
    dq_daily:
      name: dq udp_brnz daily checks and triage
      description: >-
        Runs every active and shadow rule on the selected key-attribute tables in
        sdpt_data_trnf.udp_brnz (results.check_run, results.violation_sample), then groups the
        breaches that escalate and asks system.ai.gpt-oss-120b for a verdict on each group
        (results.cohort). Writes no business data.

      schedule:
        quartz_cron_expression: "0 0 3 * * ?"
        timezone_id: Australia/Sydney
        pause_status: ${var.daily_schedule}

      # Two runs at once would both write a check run for the same day.
      max_concurrent_runs: 1
      queue:
        enabled: true
      timeout_seconds: 7200

      # Uncomment and set an address to hear about a failed run:
      # email_notifications:
      #   on_failure: [you@example.com]

      environments:
        - environment_key: checks_env
          spec:
            client: "3"
        - environment_key: triage_env
          spec:
            client: "3"
            dependencies: [openai]

      tasks:
        - task_key: run_checks
          environment_key: checks_env
          spark_python_task:
            python_file: ../jobs/run_checks.py
            parameters:
              - "--catalog"
              - "sdpt_data_trnf"
              - "--schema"
              - "udp_brnz"
              - "--prefix"
              - "dq_"
              - "--fn-prefix"
              - "sdpt_data_trnf.udp_brnz.dq_fn_"
          max_retries: 1
          min_retry_interval_millis: 600000

        # Exits early, and succeeds, when nothing escalates: true of every run until a
        # rule is promoted (sql/06_promote.sql), because a shadow rule never breaches.
        - task_key: triage
          depends_on:
            - task_key: run_checks
          environment_key: triage_env
          notebook_task:
            notebook_path: ../notebooks/03_group_and_advise.ipynb
            base_parameters:
              triage_job_run_id: "{{job.run_id}}"
          max_retries: 0

    dq_tolerance_advice:
      name: dq udp_brnz tolerance advice
      description: >-
        On demand. One system.ai.gpt-oss-120b call per key attribute, advising on its tolerance against
        the run history; writes results.tolerance_proposal and nothing else. Worth running
        only once there are a few weeks of runs.
      max_concurrent_runs: 1
      environments:
        - environment_key: advice_env
          spec:
            client: "3"
            dependencies: [openai]
      tasks:
        - task_key: advise
          environment_key: advice_env
          notebook_task:
            notebook_path: ../notebooks/06_suggest_thresholds.ipynb
            base_parameters:
              job_run_id: "{{job.run_id}}"
              only_cde: ""
