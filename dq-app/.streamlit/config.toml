# Streamlit's defaults are recognisable on sight — the red primary especially.
# This is the app's own palette: a cool neutral scale with a single petrol accent,
# reserving red/amber for severity so nothing decorative competes with a status.

[theme]
base = "light"
primaryColor = "#0d5c73"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f7f9"
textColor = "#101828"
linkColor = "#0d5c73"
borderColor = "#e4e7ec"
baseRadius = "small"
font = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif"

[server]
runOnSave = true

[browser]
gatherUsageStats = false
